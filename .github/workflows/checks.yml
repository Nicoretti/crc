name: Checks

on: workflow_call

jobs:

  discover:
    name: Discover matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - name: SCM Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Emit matrix from tasks.py
        id: emit
        run: echo "matrix=$(uvx camas==0.1.26 matrix --github-matrix)" >> "$GITHUB_OUTPUT"

  format-job:
    name: "Format (Python-${{ matrix.python-version }} on ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.12"

    steps:
      - name: SCM Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/python-environment
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Format Check
        run: uv run camas format_check

  typing-job:
    name: "Typing (Python-${{ matrix.python-version }} on ${{ matrix.os }})"
    needs: [format-job, discover]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        python-version: ${{ fromJSON(needs.discover.outputs.matrix).PY }}

    steps:
      - name: SCM Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: uv sync
        run: uv sync
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run Typing
        run: uvx camas==0.1.26 typing

  linting-job:
    name: "Lint (Python-${{ matrix.python-version }} on ${{ matrix.os }})"
    needs: [format-job]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.12"

    steps:
      - name: SCM Checkout
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: ./.github/actions/python-environment
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Linter
        run: uv run camas lint

  tests-job:
    name: "Tests (Python-${{ matrix.python-version }} on ${{ matrix.os }})"
    needs: [format-job, linting-job, typing-job, discover]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version: ${{ fromJSON(needs.discover.outputs.matrix).PY }}

    steps:
      - name: SCM Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: uv sync
        run: uv sync
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run Tests
        run: uvx camas==0.1.26 coverage
